name: release

# Pushing a tag vX.Y.Z runs the full test workflow; if every job passes, this
# creates a GitHub release for the tag with how-to-X.Y.Z.tar.gz and its
# .sha256. The Homebrew formula lives in powersagitar/homebrew-tap, whose daily
# autobump workflow opens a pull request for each new release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check tag
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          for f in src/how-to.zsh src/how-to.bash; do
            v=$(sed -n 's/^_how_to_version=//p' "$f")
            [[ $v == "${TAG#v}" ]] || { echo "::error::_how_to_version in $f is '$v', not ${TAG#v}"; exit 1; }
          done
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build tarball
        run: |
          name=how-to-$VERSION
          out=$RUNNER_TEMP/dist && mkdir -p "$out"
          git archive --format=tar.gz --prefix="$name/" -o "$out/$name.tar.gz" "$TAG" \
            src/how-to.zsh src/how-to.bash LICENSE README.md docs/usage.md
          (cd "$out" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          tar tzf "$out/$name.tar.gz"
          echo "DIST=$out" >> "$GITHUB_ENV"
      - name: Create release
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            "$DIST/how-to-$VERSION.tar.gz" "$DIST/how-to-$VERSION.tar.gz.sha256"
